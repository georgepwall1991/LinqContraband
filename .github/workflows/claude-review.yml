name: Claude Code Review

# Automated review of every ready-for-review PR by Claude (anthropics/claude-code-action).
# Needs the Claude GitHub App on this repo and one repository secret:
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY.
# Without either secret (including PRs from forks) the job skips instead of failing.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without Claude credentials
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret; skipping Claude review."

      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1

      - name: Review with Claude
        if: env.HAS_CLAUDE_AUTH == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude-authored PRs (claude[bot]) should be reviewed too. Dependabot and fork
          # PRs never see the secret above, so they skip at the first step instead.
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to LinqContraband, a Roslyn analyzer and code-fix
            package for EF Core. Read .claude/CLAUDE.md for the repo's rules first.

            Focus, in order:
            1. False positives: a diagnostic that can now fire on correct EF code. The
               analyzer must stay quiet when it cannot prove an EF-backed shape.
            2. Code fixes that can produce uncompilable or behavior-changing code.
            3. Roslyn API use newer than Microsoft.CodeAnalysis 4.3.0 in src/LinqContraband
               (the analyzer deliberately compiles against 4.3.0).
            4. Missing tests: every new reporting shape needs a "crime" test and the
               nearest "innocent" shapes; new fixable shapes need fixer coverage.
            5. Drift between RuleCatalog, docs/LCxxx_*.md, samples, CHANGELOG.md and
               docs/analyzer-health.md.

            Only report real problems. Skip style nits and anything CI already enforces.
            Put each finding as an inline comment on the relevant line, and finish with
            one short PR comment summarizing the review (or saying it found nothing).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
