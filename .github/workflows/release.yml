name: Release

# Tags and releases whatever version the csproj declares, once that commit is green.
#
# A `chore: release X.Y.Z` PR bumps <Version> in src/LinqContraband/LinqContraband.csproj
# and adds a `## [X.Y.Z]` section to CHANGELOG.md. After it merges and "Build and Test"
# passes on master, this workflow creates the annotated vX.Y.Z tag and the GitHub Release
# (notes = that CHANGELOG section), then calls publish.yml for the tag.
#
# Commits whose Version already has a release are a no-op, so this is safe to run after
# every green master build. Run it by hand (workflow_dispatch) to release master's HEAD.

on:
  # Safe use of workflow_run: the job only runs for a successful `push` build of master
  # (never a pull request), checks out that pushed master commit and executes nothing
  # from a fork.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Build and Test"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag and create the GitHub Release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag and create the release
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      needed: ${{ steps.meta.outputs.needed }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Keeps checkout credentials: the job pushes the release tag with them. It uploads
      # no artifacts, so the persisted token never leaves the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Read release metadata
        id: meta
        run: |
          VERSION="$(python3 scripts/release_info.py version)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/release_info.py check --tag "$TAG"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.meta.outputs.needed == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists; creating the release from it."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release ${VERSION}" "$TARGET_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        if: steps.meta.outputs.needed == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            python3 scripts/release_info.py notes "$VERSION"
            echo
            echo "---"
            echo
            echo "Package: https://www.nuget.org/packages/LinqContraband/${VERSION}"
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)"
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  # A reusable workflow preserves the automatic release -> publish path without
  # granting the release job permission to dispatch arbitrary Actions workflows.
  publish:
    needs: release
    if: needs.release.outputs.needed == 'true'
    permissions:
      contents: read
      id-token: write       # NuGet Trusted Publishing and attestation signing (OIDC)
      attestations: write   # build provenance for the published packages
    uses: ./.github/workflows/publish.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
