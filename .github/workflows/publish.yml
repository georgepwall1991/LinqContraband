name: Publish to NuGet

# Runs for published GitHub Releases and as a reusable workflow from release.yml
# (GITHUB_TOKEN-created releases do not fire `release: published`).
#
# Publishing uses NuGet Trusted Publishing: NuGet/login exchanges this job's GitHub OIDC
# token for a short-lived API key, so no long-lived NuGet key is stored in the repo.
# One-time setup on nuget.org: add a Trusted Publishing policy for owner
# georgepwall1991, repository LinqContraband, workflow file publish.yml (no environment),
# and store the nuget.org profile name in the NUGET_USER repository secret.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z)"
        required: true
        type: string
    secrets:
      NUGET_USER:
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z); must equal v<csproj Version>"
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, attest and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # NuGet Trusted Publishing and attestation signing (OIDC)
      attestations: write   # store the build provenance attestation for the packages
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        ref: ${{ github.event.release.tag_name || inputs.tag }}

    # Refuse to ship a package whose version disagrees with the tag it is released under.
    - name: Verify tag matches csproj Version
      run: python3 scripts/release_info.py check --tag "$RELEASE_TAG"

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    # No NuGet package cache here: a release build restores from nuget.org so a
    # poisoned Actions cache entry can never end up inside a published package.
    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Verify Sample Diagnostics
      run: dotnet run --project tools/SampleDiagnosticsVerifier/SampleDiagnosticsVerifier.csproj --configuration Release -- --configuration Release --frameworks net8.0 net9.0 net10.0

    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal

    - name: Pack
      run: |
        dotnet pack src/LinqContraband/LinqContraband.csproj -c Release --no-build --output .
        dotnet pack src/LinqContraband.Scan/LinqContraband.Scan.csproj -c Release --no-build --output .

    - name: Require NUGET_USER for Trusted Publishing
      env:
        NUGET_USER: ${{ secrets.NUGET_USER }}
      run: |
        if [ -z "$NUGET_USER" ]; then
          echo "::error::Set the NUGET_USER repository secret to the nuget.org profile name that owns the Trusted Publishing policy."
          exit 1
        fi

    - name: NuGet login (Trusted Publishing)
      id: nuget_login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    # nuget.org adds its repository signature to each package, which changes the file's bytes, so attesting the
    # local build would not match what consumers download. Download the published packages instead, check that
    # their content is this build's (everything except the signature and NuGet's per-pack metadata), and attest
    # those bytes. Verify a download with
    # `gh attestation verify LinqContraband.X.Y.Z.nupkg --repo georgepwall1991/LinqContraband`.
    - name: Download the published packages
      timeout-minutes: 30
      run: |
        set -euo pipefail
        version="${RELEASE_TAG#v}"
        mkdir -p published
        for id in LinqContraband LinqContraband.Scan; do
          lower="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
          url="https://api.nuget.org/v3-flatcontainer/${lower}/${version}/${lower}.${version}.nupkg"
          for attempt in $(seq 1 50); do
            if curl -fsSL "$url" -o "published/${id}.${version}.nupkg"; then
              break
            fi
            if [ "$attempt" -eq 50 ]; then
              echo "::error::${id} ${version} did not appear on nuget.org in time; no attestation was created."
              exit 1
            fi
            sleep 30
          done
        done

    - name: Check the published packages match this build
      run: |
        set -euo pipefail
        version="${RELEASE_TAG#v}"
        for id in LinqContraband LinqContraband.Scan; do
          rm -rf "check/${id}"
          mkdir -p "check/${id}/built" "check/${id}/published"
          unzip -q "./${id}.${version}.nupkg" -d "check/${id}/built"
          unzip -q "published/${id}.${version}.nupkg" -d "check/${id}/published"
          for side in built published; do
            rm -rf "check/${id}/${side}/.signature.p7s" "check/${id}/${side}/package" "check/${id}/${side}/_rels" "check/${id}/${side}/[Content_Types].xml"
          done
          diff -r "check/${id}/built" "check/${id}/published"
        done

    - name: Attest build provenance of the published packages
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: published/*.nupkg
