name: Publish to NuGet

# Runs for every published GitHub Release: the ones release.yml creates (it dispatches
# this workflow, because GITHUB_TOKEN-created releases do not fire `release: published`)
# and any release created by hand.
#
# Publishing uses NuGet Trusted Publishing: NuGet/login exchanges this job's GitHub OIDC
# token for a short-lived API key, so no long-lived NuGet key is stored in the repo.
# One-time setup on nuget.org: add a Trusted Publishing policy for owner
# georgepwall1991, repository LinqContraband, workflow file publish.yml (no environment),
# and store the nuget.org profile name in the NUGET_USER repository secret.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z); must equal v<csproj Version>"
        required: true
        type: string
      force_publish:
        description: "Skip the 12-hour publish cooldown"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # NuGet Trusted Publishing (OIDC)
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}

    # Refuse to ship a package whose version disagrees with the tag it is released under.
    - name: Verify tag matches csproj Version
      run: python3 scripts/release_info.py check --tag "$RELEASE_TAG"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Verify Sample Diagnostics
      run: dotnet run --project tools/SampleDiagnosticsVerifier/SampleDiagnosticsVerifier.csproj --configuration Release -- --configuration Release --frameworks net8.0 net9.0 net10.0

    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal

    # After the 16–17 Aug 2026 burst (PRs 431–436 / tags v5.7.60–v5.7.65 in ~3.5h),
    # each GitHub release published a package. The first release in a 12h window
    # still pushes; later ones skip unless the release body contains force-publish.
    - name: Check NuGet publish cooldown
      id: nuget_cooldown
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FORCE_PUBLISH: ${{ inputs.force_publish && 'true' || 'false' }}
      run: |
        python3 <<'PY'
        import json
        import os
        import subprocess
        import sys
        from datetime import datetime, timedelta, timezone

        def write_skip_push(skip):
            path = os.environ["GITHUB_OUTPUT"]
            with open(path, "a", encoding="utf-8") as handle:
                handle.write(f"skip_push={'true' if skip else 'false'}\n")

        def format_age(delta):
            total = max(0, int(delta.total_seconds()))
            hours, rem = divmod(total, 3600)
            minutes, _ = divmod(rem, 60)
            if hours > 0:
                return f"{hours}h {minutes}m"
            return f"{minutes}m"

        def parse_published_at(value):
            if not value:
                return None
            return datetime.fromisoformat(value.replace("Z", "+00:00"))

        repo = os.environ["GITHUB_REPOSITORY"]
        current_tag = os.environ["RELEASE_TAG"]

        with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
            event = json.load(handle)
        release_event = event.get("release")
        if release_event is None:
            # workflow_dispatch: look the release up by tag (it may not exist yet).
            lookup = subprocess.run(
                ["gh", "api", f"/repos/{repo}/releases/tags/{current_tag}"],
                check=False,
                capture_output=True,
                text=True,
            )
            release_event = json.loads(lookup.stdout) if lookup.returncode == 0 else {}
        body = release_event.get("body") or ""
        current_id = str(release_event.get("id") or "")

        if os.environ.get("FORCE_PUBLISH") == "true":
            print("force_publish input set; continuing with NuGet pack/push")
            write_skip_push(False)
            sys.exit(0)

        if "force-publish" in body.lower():
            print("force-publish found in release body; continuing with NuGet pack/push")
            write_skip_push(False)
            sys.exit(0)

        endpoint = f"/repos/{repo}/releases?per_page=100"
        result = subprocess.run(
            ["gh", "api", "--paginate", "--slurp", endpoint],
            check=False,
            capture_output=True,
            text=True,
        )
        if result.returncode != 0:
            if result.stderr:
                print(result.stderr, file=sys.stderr)
            sys.exit(result.returncode or 1)

        data = json.loads(result.stdout)
        releases = []
        if isinstance(data, list):
            if data and isinstance(data[0], list):
                for page in data:
                    releases.extend(page)
            elif data and isinstance(data[0], dict):
                releases = data

        now = datetime.now(timezone.utc)
        window = timedelta(hours=12)
        latest = None
        for release in releases:
            if release.get("draft"):
                continue
            release_id = str(release.get("id", ""))
            tag_name = release.get("tag_name") or ""
            if release_id == current_id or tag_name == current_tag:
                continue
            published_at = parse_published_at(release.get("published_at"))
            if published_at is None:
                continue
            if latest is None or published_at > latest[0]:
                latest = (published_at, tag_name)

        if latest is None:
            print("No other GitHub releases found; continuing with NuGet pack/push")
            write_skip_push(False)
            sys.exit(0)

        published_at, tag_name = latest
        age = now - published_at
        age_text = format_age(age)
        if age < window:
            print(f"last release tag: {tag_name}, age: {age_text}")
            print("skipped nuget push; add force-publish to the release body, or re-run publish.yml with force_publish, to override")
            write_skip_push(True)
            sys.exit(0)

        print(
            f"No other GitHub release in the last 12 hours "
            f"(last other tag: {tag_name}, age: {age_text}); continuing with NuGet pack/push"
        )
        write_skip_push(False)
        PY

    - name: Pack
      if: success() && steps.nuget_cooldown.outputs.skip_push != 'true'
      run: dotnet pack src/LinqContraband/LinqContraband.csproj -c Release --no-build --output .
      
    - name: Require NUGET_USER for Trusted Publishing
      if: success() && steps.nuget_cooldown.outputs.skip_push != 'true'
      env:
        NUGET_USER: ${{ secrets.NUGET_USER }}
      run: |
        if [ -z "$NUGET_USER" ]; then
          echo "::error::Set the NUGET_USER repository secret to the nuget.org profile name that owns the Trusted Publishing policy."
          exit 1
        fi

    - name: NuGet login (Trusted Publishing)
      id: nuget_login
      if: success() && steps.nuget_cooldown.outputs.skip_push != 'true'
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      if: success() && steps.nuget_cooldown.outputs.skip_push != 'true'
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push *.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
