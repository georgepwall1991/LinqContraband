name: Claude

# On-demand Claude: mention @claude in a PR or issue comment, a review comment or a new
# issue (e.g. "@claude review this" or "@claude fix the LC042 false positive"). Only the
# repo owner, members and collaborators can trigger it, and it runs only when asked, so it
# uses Claude only when you want it. Uses the same secret as claude-review.yml.
# issue_comment and the review triggers run with repository secrets, so the job below
# only starts for an explicit @claude from the owner, a member or a collaborator.
on: # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    name: Claude on request
    if: >-
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push the branch for a requested fix
      pull-requests: write   # open and comment on pull requests
      issues: write          # reply on issues
      id-token: write        # claude-code-action GitHub App token exchange (OIDC)
      actions: read          # read CI results for the PR
    steps:
      # Keeps checkout credentials so a requested fix can be pushed. The job uploads no
      # artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: true # zizmor: ignore[artipacked]

      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model sonnet
            --max-turns 40
