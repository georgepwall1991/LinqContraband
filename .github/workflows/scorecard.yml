name: OpenSSF Scorecard

# Publishes the repository's OpenSSF Scorecard (https://scorecard.dev) and uploads the
# findings to GitHub code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'  # Weekly Monday 6:30am UTC
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload SARIF to code scanning
      id-token: write         # publish results to the Scorecard API (badge)

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
